name: Ledger API CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Check PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run unit tests
        run: php tests/run.php
